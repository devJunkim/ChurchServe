name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Angular dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Angular tests
        run: npm run test:ci

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Build production release artifact
        run: npm run build:release

      - name: Run API integration tests
        run: dotnet test ChurchServe.slnx --configuration Release

      - name: Verify published release artifact
        run: npm run test:release

      - name: Run critical browser journeys
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: churchserve-${{ github.sha }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 7
